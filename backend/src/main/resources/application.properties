# CONFIGURACIÓN DE DEPURACIÓN DEFINITIVA
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pointcheck_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Config local con secretos reales (no versionado): sobreescribe los ${...} de arriba
spring.config.import=optional:classpath:application-local.properties

# Evitar que Spring use una DB en memoria si MySQL falla
spring.test.database.replace=none

# JPA / Hibernate
# 'validate' asegura que el esquema sea correcto sin modificar datos ni ejecutar semillas
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Buena práctica: Evita el antipatrón Open Session in View
spring.jpa.open-in-view=false

# Logging para depuración equilibrada (SQL visible, parámetros solo si hay error)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Inicialización de datos
# Desactivamos la automática (siempre falla con duplicados) 
# y dejamos que DatabaseInitializer.kt gestione la lógica.
spring.sql.init.mode=never 
spring.jpa.defer-datasource-initialization=false
# Mantenemos esto en false para capturar errores reales en el Initializer si ocurrieran
spring.sql.init.continue-on-error=true 


# Server
server.port=8080
server.address=0.0.0.0

# External APIs
openweather.api.base-url=https://api.openweathermap.org
openweather.api.path=/data/2.5/weather
openweather.api.key=${OPENWEATHER_API_KEY}

# Google Maps & Places
google.maps.api.key=${GOOGLE_MAPS_API_KEY}
google.maps.place.details.url=https://maps.googleapis.com/maps/api/place/details/json
