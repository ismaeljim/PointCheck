spring.datasource.url=jdbc:mysql://localhost:3306/pointcheck_db?useSSL=false&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

openweather.api.base-url=https://api.openweathermap.org
openweather.api.path=/data/2.5/weather
openweather.api.key=${OPENWEATHER_API_KEY}

google.maps.api.key=${GOOGLE_MAPS_API_KEY}
google.maps.place.details.url=https://maps.googleapis.com/maps/api/place/details/json
