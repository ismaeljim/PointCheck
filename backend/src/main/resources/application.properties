# Configuración de Base de Datos - Embebida para Commit
spring.datasource.url=jdbc:mysql://localhost:3306/pointcheck_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'none' porque controlamos la estructura manualmente en schema.sql (más estable para MySQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos (Scripts manuales)
spring.sql.init.mode=always
# Continuar aunque las tablas ya existan (útil tras el primer arranque exitoso)
spring.sql.init.continue-on-error=false

# Server
server.port=8080

# External APIs - Credenciales (Reemplazar con llaves reales antes del commit si es necesario)
openweather.api.base-url=https://api.openweathermap.org
openweather.api.path=/data/2.5/weather
openweather.api.key=${OPENWEATHER_API_KEY}

google.maps.api.key=${GOOGLE_MAPS_API_KEY}
google.maps.place.details.url=https://maps.googleapis.com/maps/api/place/details/json
