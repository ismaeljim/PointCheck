# Optimización de memoria para Gradle - Aumentado para soportar Android + Spring Boot simultáneos
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Rendimiento y Aislamiento (Buenas Prácticas)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Habilitar soporte para AndroidX
android.useAndroidX=true

# Jetifier desactivado (ya que no usas librerías antiguas)
android.enableJetifier=false

# Estilo oficial para Kotlin
kotlin.code.style=official

# Habilita la caché de configuración de Gradle (Desactivado temporalmente para limpiar conflictos de plugins)
org.gradle.configuration-cache=false

# Evita errores con R class en Compose y AGP modernos
android.nonTransitiveRClass=true

# Suppress warning for compileSdk 35 with AGP 8.2.0
android.suppressUnsupportedCompileSdk=35

# Path to the JDK to be used by Gradle
org.gradle.java.home=C\:/Program Files/Android/Android Studio/jbr
